databases:
  - name: algovista-postgres
    plan: basic-256mb
    region: singapore
    databaseName: algovista
    user: algovista_app
    ipAllowList: []

services:
  - type: web
    name: algovista-backend
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run backend
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: algovista-postgres
          property: connectionString
      - key: COOKIE_SAME_SITE
        value: Lax
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_TTL_DAYS
        value: 7
      - key: SESSION_DIGEST_PEPPER
        generateValue: true
      - key: CSRF_DIGEST_PEPPER
        generateValue: true
      - key: RATE_LIMIT_PEPPER
        generateValue: true
      - key: PASSWORD_HASH_CONCURRENCY
        value: 2
      - key: PASSWORD_HASH_QUEUE_LIMIT
        value: 32
      - key: AI_DAILY_REQUEST_LIMIT
        value: 150
      - key: AI_PROVIDER_CONCURRENCY
        value: 4
      - key: AI_PROVIDER_QUEUE_LIMIT
        value: 40
      - key: AI_PROVIDER_TIMEOUT_MS
        value: 15000
      - key: AI_PROVIDER_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_PROVIDER_MODEL
        value: gemini-3.6-flash
      - key: AI_TUTOR_OFFLINE
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
