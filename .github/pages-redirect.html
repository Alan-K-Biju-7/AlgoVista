<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=https://algovista-seven.vercel.app/" />
    <meta name="robots" content="noindex" />
    <title>Opening AlgoVista…</title>
    <script>
      (() => {
        const pagesBase = '/AlgoVista';
        const path = window.location.pathname.startsWith(pagesBase)
          ? window.location.pathname.slice(pagesBase.length)
          : window.location.pathname;
        const destination = new URL(path || '/', 'https://algovista-seven.vercel.app');
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.toString());
      })();
    </script>
  </head>
  <body>
    <p>
      Opening the full <a href="https://algovista-seven.vercel.app/">AlgoVista application</a>…
    </p>
  </body>
</html>
